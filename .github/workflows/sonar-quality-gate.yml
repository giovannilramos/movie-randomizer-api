name: SonarCloud
on:
  pull_request:
    types: [ opened, edited, synchronize, reopened ]
  push:
    branches: [ main ]
jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 23
          cache: maven

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Sonar scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=giovannilramos_movie-randomizer-api -Dsonar.coverage.jacoco.xmlReportPaths=target/jacoco/jacoco.xml

      - name: Check Quality Gate status
        run: |
          if [ -n "${{ github.event.pull_request.number }}" ]; then
            PR_NUMBER=$(echo "${{ github.event.pull_request.url }}" | awk -F '/' '{print $NF}')
            sleep 15
            QUALITY_GATE_STATUS=$(curl -s "https://sonarcloud.io/api/qualitygates/project_status?projectKey=giovannilramos_movie-randomizer-api&pullRequest=$PR_NUMBER" | jq -r '.projectStatus.status')
          else
            DETAILS_URL="https://sonarcloud.io/api/qualitygates/project_status?projectKey=giovannilramos_movie-randomizer-api&branch=main"          
            QUALITY_GATE_STATUS=$(curl -s "https://sonarcloud.io/api/qualitygates/project_status?projectKey=giovannilramos_movie-randomizer-api&branch=main" | jq -r '.projectStatus.status')
          fi

          if [ "$QUALITY_GATE_STATUS" != "OK" ]; then
            echo "Quality Gate did not pass. Exiting with failure."
            exit 1
          else
            echo "Quality Gate passed."
          fi