name: Mutation Testing

on:
  pull_request:
    types: [ opened, edited, synchronize, reopened ]
  push:
    branches: [ main ]
jobs:
  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          java-version: 23
          distribution: temurin
          cache: maven

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run tests with JaCoCo
        run: |
          mvn clean verify \
            -Djacoco.line.minimum=0.80 \
            -Djacoco.branch.minimum=0.70

      - name: Run PIT Mutation Coverage
        id: pitest
        run: |
          mvn org.pitest:pitest-maven:mutationCoverage \
          -DwithHistory \
          -DoutputFormats=XML \
          -DreportsDirectory=target/pit-reports

      - name: Extract mutation coverage from XML
        id: extract-mutation
        run: |
          MUTATION_FILE=$(find target/pit-reports -name "mutations.xml" | head -n1)
          
          if [ -f "$MUTATION_FILE" ]; then
            MUTATION=$(grep -oP 'mutationCoverage="\K[0-9.]+' "$MUTATION_FILE" | head -n1)
          
            MUTATION_PERCENT=$(echo "scale=0; $MUTATION * 100 / 1" | bc)
          
            echo "Mutation coverage: ${MUTATION_PERCENT}%"
            echo "mutation=${MUTATION_PERCENT}" >> $GITHUB_ENV
            echo "MUTATION_PERCENT=${MUTATION_PERCENT}" >> $GITHUB_OUTPUT
          else
            echo "Mutation file not found!"
            echo "mutation=0" >> $GITHUB_ENV
            echo "MUTATION_PERCENT=0" >> $GITHUB_OUTPUT
          fi

      - name: Check mutation coverage threshold
        run: |
          echo "Current mutation coverage: ${MUTATION_PERCENT}%"
          echo "Minimum required: 90%"
          
          if [ "${MUTATION_PERCENT}" -lt 90 ]; then
            echo "Mutation coverage below 90%! Failing."
            exit 1
          else
            echo "Mutation coverage acceptable"
          fi

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pitest-mutation-report
          path: target/pit-reports/

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: target/