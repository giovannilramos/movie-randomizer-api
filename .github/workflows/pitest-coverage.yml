name: Mutation Testing

on:
  pull_request:
    types: [ opened, edited, synchronize, reopened ]
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          java-version: 23
          distribution: temurin
          cache: maven

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build Project
        run: mvn clean install

      - name: Generate JaCoCo Badges for Module Application
        id: jacoco
        uses: cicirello/jacoco-badge-generator@v2
        with:
          generate-branches-badge: true
          jacoco-csv-file: target/jacoco/jacoco.csv
          coverage-badge-filename: jacoco.svg
          branches-badge-filename: branches.svg
          coverage-label: coverage
          branches-label: branches

      - name: Log Coverage Percentage
        run: |
          echo "coverage = ${{ steps.jacoco.outputs.coverage }}"
          echo "branch coverage = ${{ steps.jacoco.outputs.branches }}"

      - name: Commit and push the badge (if it changed)
        uses: EndBug/add-and-commit@v9.1.4
        with:
          default_author: github_actions
          push: origin main --force
          message: 'chore: change badges coverage'
          add: '*.svg'

      - name: Run PIT Mutation Coverage
        id: pitest
        run: |
          mvn org.pitest:pitest-maven:mutationCoverage \
          -DwithHistory \
          -DoutputFormats=XML \
          -DreportsDirectory=target/pit-reports

      - name: Extract mutation coverage from XML
        id: extract-mutation
        run: |
          MUTATION_FILE=$(find target/pit-reports -name "mutations.xml" | head -n1)
          
          if [ -f "$MUTATION_FILE" ]; then
            MUTATION=$(grep -oP 'mutationCoverage="\K[0-9.]+' "$MUTATION_FILE" | head -n1)
          
            MUTATION_PERCENT=$(echo "scale=0; $MUTATION * 100 / 1" | bc)
          
            echo "Mutation coverage: ${MUTATION_PERCENT}%"
            echo "mutation=${MUTATION_PERCENT}" >> $GITHUB_ENV
            echo "MUTATION_PERCENT=${MUTATION_PERCENT}" >> $GITHUB_OUTPUT
          else
            echo "Mutation file not found!"
            echo "mutation=0" >> $GITHUB_ENV
            echo "MUTATION_PERCENT=0" >> $GITHUB_OUTPUT
          fi

      - name: Check mutation coverage threshold
        run: |
          echo "Current mutation coverage: ${MUTATION_PERCENT}%"
          echo "Minimum required: 90%"
          
          if [ "${MUTATION_PERCENT}" -lt 90 ]; then
            echo "Mutation coverage below 90%! Failing."
            exit 1
          else
            echo "Mutation coverage acceptable"
          fi

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pitest-mutation-report
          path: target/pit-reports/
